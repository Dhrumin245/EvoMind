name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Git ref to deploy on the Windows production host
        required: true
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, production]
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}

      - name: Deploy Windows services
        shell: pwsh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          .\deploy\windows\deploy.ps1 -SourcePath $env:GITHUB_WORKSPACE -DeployPath $env:DEPLOY_PATH
