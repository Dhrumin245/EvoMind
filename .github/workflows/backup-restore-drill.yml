name: Backup Restore Drill

on:
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:

concurrency:
  group: backup-restore-drill
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: evomind
          POSTGRES_USER: evomind
          POSTGRES_PASSWORD: evomind_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evomind -d evomind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      EVOMIND_BACKUP_DIR: ${{ github.workspace }}/.tmp/evomind-backups
      EVOMIND_CONTROL_PLANE_DB_URL: postgresql://evomind:evomind_test_password@127.0.0.1:5432/evomind
      EVOMIND_DATA_DIR: ${{ github.workspace }}/.tmp/evomind-data
      EVOMIND_ENV: production
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Generate drill webhook secret
        run: |
          key="$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")"
          echo "EVOMIND_WEBHOOK_SECRET_KEY=$key" >> "$GITHUB_ENV"

      - name: Run backup restore drill
        run: |
          python scripts/backup_restore_drill.py
