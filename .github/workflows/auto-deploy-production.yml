name: Auto Deploy Production

on:
  workflow_run:
    workflows:
      - Windows Release
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Git ref to deploy on the Windows production host
        required: true
        default: main

concurrency:
  group: auto-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: [self-hosted, Windows, production]
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.deploy_ref || 'main' }}

      - name: Deploy Windows services
        shell: pwsh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          .\deploy\windows\deploy.ps1 -SourcePath $env:GITHUB_WORKSPACE -DeployPath $env:DEPLOY_PATH
