name: API CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify pinned runtime dependencies
        run: |
          if grep -En '^[A-Za-z0-9_.-]+(\[[^]]+\])?\s*(>=|>|~=|<|<=)' requirements.txt; then
            echo "requirements.txt must pin exact versions"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Validate dependency graph
        run: |
          python -m pip check

      - name: Compile API modules
        run: |
          python -m py_compile api/auth.py api/backup.py api/db_init.py api/env_utils.py api/events.py api/interface.py api/job_manager.py api/logging_utils.py api/schemas.py api/server.py api/storage.py api/trainer.py api/worker.py api/worker_healthcheck.py scripts/backup_job.py scripts/backup_restore_drill.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests
