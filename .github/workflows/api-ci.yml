name: API CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify pinned runtime dependencies
        shell: pwsh
        run: |
          $matches = Select-String -Path requirements.txt -Pattern '^[A-Za-z0-9_.-]+(\[[^]]+\])?\s*(>=|>|~=|<|<=)'
          if ($matches) {
            $matches | ForEach-Object { Write-Host $_.Line }
            throw "requirements.txt must pin exact versions"
          }

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Validate dependency graph
        run: |
          python -m pip check

      - name: Compile API modules
        shell: pwsh
        run: |
          python -m py_compile api/auth.py api/backup.py api/env_utils.py api/events.py api/interface.py api/job_manager.py api/logging_utils.py api/schemas.py api/server.py api/trainer.py api/worker.py api/worker_healthcheck.py scripts/backup_job.py scripts/backup_restore_drill.py

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests

      - name: Validate Windows deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy\windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) {
            throw "PowerShell deployment script validation failed"
          }
