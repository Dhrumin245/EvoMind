services:
  worker:
    build:
      context: .
      target: worker
    image: ${EVOMIND_WORKER_IMAGE:-evomind-worker:windows-local}
    environment:
      EVOMIND_BACKUP_DIR: C:\app\backups
      EVOMIND_CONTROL_PLANE_DB_URL_FILE: C:\run\secrets\control_plane_db_url.txt
      EVOMIND_CORS_ALLOW_ORIGINS: ${EVOMIND_CORS_ALLOW_ORIGINS:-}
      EVOMIND_DATA_DIR: C:\app\data
      EVOMIND_ENABLE_API_DOCS: "false"
      EVOMIND_ENV: production
      EVOMIND_LOG_LEVEL: ${EVOMIND_LOG_LEVEL:-INFO}
      EVOMIND_TENANT_ROOT_DIR: C:\app\data\tenants
      EVOMIND_WEBHOOK_SECRET_KEY_FILE: C:\run\secrets\webhook_secret_key.txt
      MPLBACKEND: Agg
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    restart: unless-stopped
    volumes:
      - type: volume
        source: evomind_data
        target: C:\app\data
      - type: volume
        source: evomind_backups
        target: C:\app\backups
      - type: bind
        source: ${EVOMIND_CONTROL_PLANE_DB_URL_FILE:?set in env file}
        target: C:\run\secrets\control_plane_db_url.txt
        read_only: true
      - type: bind
        source: ${EVOMIND_WEBHOOK_SECRET_KEY_FILE:?set in env file}
        target: C:\run\secrets\webhook_secret_key.txt
        read_only: true
    networks:
      - control_plane

  api:
    build:
      context: .
      target: api
    image: ${EVOMIND_API_IMAGE:-evomind-api:windows-local}
    environment:
      EVOMIND_BACKUP_DIR: C:\app\backups
      EVOMIND_CONTROL_PLANE_DB_URL_FILE: C:\run\secrets\control_plane_db_url.txt
      EVOMIND_CORS_ALLOW_ORIGINS: ${EVOMIND_CORS_ALLOW_ORIGINS:?set in env file}
      EVOMIND_DATA_DIR: C:\app\data
      EVOMIND_ENABLE_API_DOCS: "false"
      EVOMIND_ENV: production
      EVOMIND_LOG_LEVEL: ${EVOMIND_LOG_LEVEL:-INFO}
      EVOMIND_TENANT_ROOT_DIR: C:\app\data\tenants
      EVOMIND_WEBHOOK_SECRET_KEY_FILE: C:\run\secrets\webhook_secret_key.txt
      MPLBACKEND: Agg
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    volumes:
      - type: volume
        source: evomind_data
        target: C:\app\data
      - type: volume
        source: evomind_backups
        target: C:\app\backups
      - type: bind
        source: ${EVOMIND_CONTROL_PLANE_DB_URL_FILE:?set in env file}
        target: C:\run\secrets\control_plane_db_url.txt
        read_only: true
      - type: bind
        source: ${EVOMIND_WEBHOOK_SECRET_KEY_FILE:?set in env file}
        target: C:\run\secrets\webhook_secret_key.txt
        read_only: true
    networks:
      - edge
      - control_plane

volumes:
  evomind_data:
  evomind_backups:

networks:
  edge:
  control_plane:
    internal: true
