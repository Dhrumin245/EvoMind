services:
  volume-init:
    image: ${EVOMIND_API_IMAGE:-evomind-api:linux-local}
    user: root
    command: ["sh", "-c", "mkdir -p /app/data /app/backups && chown -R evomind:evomind /app/data /app/backups"]
    restart: "no"
    volumes:
      - evomind_data:/app/data
      - evomind_backups:/app/backups

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: evomind
      POSTGRES_USER: evomind
      POSTGRES_PASSWORD: evomind_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evomind -d evomind"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - evomind_postgres_data:/var/lib/postgresql/data
    networks:
      - control_plane

  worker:
    build:
      context: .
      target: worker
    image: ${EVOMIND_WORKER_IMAGE:-evomind-worker:linux-local}
    environment:
      EVOMIND_BACKUP_DIR: /app/backups
      EVOMIND_CONTROL_PLANE_DB_URL: postgresql://evomind:evomind_dev_password@postgres:5432/evomind
      EVOMIND_CORS_ALLOW_ORIGINS: ${EVOMIND_CORS_ALLOW_ORIGINS:-}
      EVOMIND_DATA_DIR: /app/data
      EVOMIND_ENABLE_API_DOCS: "false"
      EVOMIND_ENV: production
      EVOMIND_LOG_LEVEL: ${EVOMIND_LOG_LEVEL:-INFO}
      EVOMIND_TENANT_ROOT_DIR: /app/data/tenants
      EVOMIND_WEBHOOK_SECRET_KEY: ${EVOMIND_WEBHOOK_SECRET_KEY:-VvWSoDJJb_4f-7sPyBOZ1bQeR6T1t-fmqHNwcgBkz9o=}
      MPLBACKEND: Agg
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "api.worker_healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    volumes:
      - evomind_data:/app/data
      - evomind_backups:/app/backups
    networks:
      - control_plane

  api:
    build:
      context: .
      target: api
    image: ${EVOMIND_API_IMAGE:-evomind-api:linux-local}
    environment:
      EVOMIND_BACKUP_DIR: /app/backups
      EVOMIND_CONTROL_PLANE_DB_URL: postgresql://evomind:evomind_dev_password@postgres:5432/evomind
      EVOMIND_CORS_ALLOW_ORIGINS: ${EVOMIND_CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      EVOMIND_DATA_DIR: /app/data
      EVOMIND_ENABLE_API_DOCS: "false"
      EVOMIND_ENV: production
      EVOMIND_LOG_LEVEL: ${EVOMIND_LOG_LEVEL:-INFO}
      EVOMIND_TENANT_ROOT_DIR: /app/data/tenants
      EVOMIND_WEBHOOK_SECRET_KEY: ${EVOMIND_WEBHOOK_SECRET_KEY:-VvWSoDJJb_4f-7sPyBOZ1bQeR6T1t-fmqHNwcgBkz9o=}
      MPLBACKEND: Agg
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/readiness', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    volumes:
      - evomind_data:/app/data
      - evomind_backups:/app/backups
    networks:
      - edge
      - control_plane

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: ${EVOMIND_FRONTEND_IMAGE:-evomind-frontend:linux-local}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - edge

volumes:
  evomind_postgres_data:
  evomind_data:
  evomind_backups:

networks:
  edge:
  control_plane:
    internal: true
